name: Build macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # CI=true (set by GitHub Actions) makes the DMG script skip the Finder layout step.
      - name: Build app and DMG
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Verify signature
        run: codesign --verify --deep --strict src-tauri/target/${{ matrix.target }}/release/bundle/macos/Gander.app

      - uses: actions/upload-artifact@v4
        with:
          name: Gander-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dmg
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dmg/*.dmg
