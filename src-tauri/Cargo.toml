[package]
name = "gander"
version = "0.1.0"
description = "Compact DuckDB data viewer built with Tauri, with a localhost API so agents can read and drive queries"
authors = ["you"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1.20001.0", features = ["bundled", "json", "parquet"] }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
tauri-plugin-dialog = "2"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
toml = "1.2.2"
anyhow = "1.0.105"
parking_lot = "0.12.5"
dirs = "7.0.0"
subtle = "2.6.1"
futures = "0.3.34"
nucleo-matcher = "0.3.1"
schemars = "1.2.3"
tokio-stream = { version = "0.1.19", features = ["sync"] }
getrandom = "0.3"
sha2 = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
